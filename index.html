<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Тренажёр менеджера AMINA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: левая колонка с картой курса (уроки как ячейки кассеты), справа рабочая зона урока; на телефоне — одна колонка */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --fg:#18231C; --muted:#5B6B60; --line:#D6DFD7;
  --leaf:#2F7A4C; --leaf-soft:#E1EFE5; --amber:#B7791F; --amber-soft:#FBF0DC;
  --bad:#B3402F; --bad-soft:#F8E3DF;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#18221B; --fg:#E4ECE6; --muted:#9AAEA0; --line:#2C3A30;
  --leaf:#5FBF85; --leaf-soft:#1F3427; --amber:#E2A84B; --amber-soft:#3A2F1C;
  --bad:#E77C6A; --bad-soft:#3B2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#18221B; --fg:#E4ECE6; --muted:#9AAEA0; --line:#2C3A30;
  --leaf:#5FBF85; --leaf-soft:#1F3427; --amber:#E2A84B; --amber-soft:#3A2F1C;
  --bad:#E77C6A; --bad-soft:#3B2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--leaf);width:0}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:16px}
.mod h3{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cell{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell b{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.cell span{font-size:13px;line-height:1.3}
.cell.done{background:var(--leaf-soft);border-color:var(--leaf)}
.cell.done b{color:var(--leaf)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.locked{opacity:.5}
main{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
@media (max-width:500px){main{padding:16px}}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--leaf)}
.lesson{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.lesson ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tip{background:var(--amber-soft);border-radius:8px;padding:12px 14px;max-width:66ch}
.tip strong{color:var(--amber)}
.flash{display:flex;flex-direction:column;align-items:center;gap:14px}
.card{width:100%;max-width:460px;min-height:190px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;gap:8px}
.card .face{font-family:var(--f-display);font-size:22px;font-weight:500}
.card .back{font-size:16px}
.card small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q p{margin:0;font-weight:600}
.q .hint{font-weight:400;color:var(--muted);font-size:13px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--leaf)}
.opt.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict{border-radius:10px;padding:14px 16px;font-weight:600}
.verdict.pass{background:var(--leaf-soft);color:var(--leaf)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.case{background:var(--bg);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;font-weight:500}
.note{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.share{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.share input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 200px;max-width:280px}
.fallback{width:100%;font:13px/1.45 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.98)}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Тренажёр менеджера AMINA</h1>
      <p class="sub">16 коротких уроков: продукт, МойСклад, продажи. Урок → карточки → тест на 80%.</p>
    </div>
    <nav class="nav" aria-label="Разделы">
      <button id="nav-course" aria-pressed="true">Курс</button>
      <button id="nav-final" aria-pressed="false">Аттестация</button>
      <button id="nav-team" aria-pressed="false" hidden>Результаты команды</button>
    </nav>
  </header>
  <div class="progress"><span id="prog-text">Пройдено 0 из 16</span><div class="bar"><i id="prog-bar"></i></div><span id="save-state">Результаты сохраняются в этом браузере</span></div>
  <div id="share" class="share" hidden>
    <label for="my-name">Твоё имя</label>
    <input id="my-name" type="text" placeholder="Например, Иван Петров" autocomplete="name">
    <button id="copy-res" class="btn" type="button">Скопировать мой результат</button>
    <span id="copy-note" class="note">Вставь текст в Telegram руководителю</span>
  </div>
  <textarea id="copy-fallback" class="fallback" rows="6" readonly hidden aria-label="Текст результата"></textarea>

  <section id="view-course" class="grid">
    <aside id="map" aria-label="Карта курса"></aside>
    <main id="stage"></main>
  </section>
  <section id="view-final" hidden><main id="final"></main></section>
  <section id="view-team" hidden><main id="team"></main></section>
</div>

/* ---------- state ---------- */
const S = {results:{}, final:null, cur:"1.1", tab:"lesson", view:"course", cardIdx:0, cardBack:false, known:{}};
let DB=null, USER=null, UID=null, saveTimer=null, saving=false, pending=false;

function loadLocal(){try{const r=JSON.parse(localStorage.getItem("amina-trener")||"null");if(r){S.results=r.results||{};S.final=r.final||null;}}catch(e){}}
function saveLocal(){try{localStorage.setItem("amina-trener",JSON.stringify({results:S.results,final:S.final}))}catch(e){}}
async function saveRemote(){
  if(!DB||!UID) return;
  if(saving){pending=true;return}
  saving=true;
  try{await DB.doc("results/"+UID).set({lessons:S.results,final:S.final,updatedAt:new Date().toISOString()});setSave("Результаты сохранены — их видит руководитель")}
  catch(e){setSave("Не удалось сохранить на сервере, результаты остались в браузере")}
  saving=false; if(pending){pending=false;saveRemote()}
}
function persist(){saveLocal();saveRemote()}
function setSave(t){document.getElementById("save-state").textContent=t}

const passed = id => S.results[id] && S.results[id].best>=0.8;
const unlocked = i => i===0 || passed(LESSONS[i-1].id);
const MODS = {1:"Модуль 1 · Компания и ассортимент",2:"Модуль 2 · Продукт по группам",3:"Модуль 3 · Работа в МойСклад",4:"Модуль 4 · Техника продаж"};

function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}

function renderProgress(){
  const n=LESSONS.filter(l=>passed(l.id)).length;
  document.getElementById("prog-text").textContent=`Пройдено ${n} из ${LESSONS.length}`+(S.final&&S.final.passed?" · аттестация сдана":"");
  document.getElementById("prog-bar").style.width=(n/LESSONS.length*100)+"%";
}
function renderMap(){
  const map=document.getElementById("map");map.replaceChildren();
  for(const m of [1,2,3,4]){
    const tray=el("div",{class:"tray"});
    LESSONS.forEach((l,i)=>{ if(l.mod!==m) return;
      const lock=!unlocked(i);
      const r=S.results[l.id];
      tray.append(el("button",{class:"cell"+(passed(l.id)?" done":"")+(S.cur===l.id?" cur":"")+(lock?" locked":""),id:"cell-"+l.id.replace(".","-"),
        "aria-label":`Урок ${l.id} ${l.title}${lock?", закрыт":""}`,
        onclick:()=>{ if(lock) return; S.cur=l.id;S.tab="lesson";S.cardIdx=0;S.cardBack=false;render(); }},
        el("b",{},l.id+(r?` · ${Math.round(r.best*100)}%`:lock?" · закрыт":"")),el("span",{},l.title)));
    });
    map.append(el("div",{class:"mod"},el("h3",{},MODS[m]),tray));
  }
}
function renderStage(){
  const l=LESSONS.find(x=>x.id===S.cur), st=document.getElementById("stage");st.replaceChildren();
  st.append(el("div",{},el("div",{class:"eyebrow"},MODS[l.mod]),el("h2",{},`Урок ${l.id}. ${l.title}`)));
  const tabs=el("div",{class:"tabs",role:"tablist"});
  [["lesson","Обучалка"],["cards","Карточки"],["quiz","Тест"]].forEach(([k,t])=>tabs.append(el("button",{role:"tab","aria-selected":S.tab===k?"true":"false",id:"tab-"+k,onclick:()=>{S.tab=k;S.cardIdx=0;S.cardBack=false;renderStage()}},t)));
  st.append(tabs);
  if(S.tab==="lesson"){
    st.append(el("div",{class:"lesson"},el("ul",{},l.text.map(t=>el("li",{},t)))),
      el("div",{class:"tip"},el("strong",{},"Запомни: "),l.tip),
      el("div",{class:"row",style:"justify-content:flex-start"},el("button",{class:"btn primary",onclick:()=>{S.tab="cards";renderStage()}},"К карточкам")));
  } else if(S.tab==="cards"){
    const deck=l.cards, i=S.cardIdx%deck.length, c=deck[i];
    const knownSet=S.known[l.id]||(S.known[l.id]=new Set());
    const card=el("div",{class:"card",tabindex:"0",role:"button","aria-label":"Перевернуть карточку",onclick:()=>{S.cardBack=!S.cardBack;renderStage()},onkeydown:e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();S.cardBack=!S.cardBack;renderStage()}}},
      S.cardBack?el("div",{class:"back"},c[1]):el("div",{class:"face"},c[0]),
      el("small",{},S.cardBack?"Ответ":"Нажми, чтобы перевернуть"));
    const next=k=>{if(k) knownSet.add(i); else knownSet.delete(i); S.cardBack=false;
      let j=i; for(let s=1;s<=deck.length;s++){const t=(i+s)%deck.length; if(!knownSet.has(t)){j=t;break}} S.cardIdx=j; renderStage();};
    const all=knownSet.size===deck.length;
    st.append(el("div",{class:"flash"},
      el("div",{class:"note"},`Карточка ${i+1} из ${deck.length} · знаю: ${knownSet.size}`),
      all?el("div",{class:"verdict pass"},"Все карточки в «знаю». Можно сдавать тест."):card,
      all?el("div",{class:"row"},el("button",{class:"btn",onclick:()=>{S.known[l.id]=new Set();S.cardIdx=0;renderStage()}},"Пройти ещё раз"),el("button",{class:"btn primary",onclick:()=>{S.tab="quiz";renderStage()}},"К тесту"))
        :el("div",{class:"row"},el("button",{class:"btn",onclick:()=>next(false)},"Ещё повторю"),el("button",{class:"btn primary",onclick:()=>next(true)},"Знаю"))));
  } else {
    st.append(quizBlock(l.quiz,`quiz-${l.id}`,score=>{
      const prev=S.results[l.id]; const best=Math.max(score,prev?prev.best:0);
      S.results[l.id]={best,last:score,tries:(prev?prev.tries:0)+1,at:new Date().toISOString()};
      persist();renderProgress();renderMap();
    },()=>{const i=LESSONS.findIndex(x=>x.id===l.id); if(LESSONS[i+1]&&unlocked(i+1)){S.cur=LESSONS[i+1].id;S.tab="lesson";render()}}));
  }
}
function shuffleIdx(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizBlock(qs,key,onDone,onNext){
  const box=el("div",{});
  const order=qs.map(q=>shuffleIdx(q.a.length));
  const form=el("form",{id:key});
  qs.forEach((q,qi)=>{
    const wrap=el("div",{class:"q"},el("p",{},`${qi+1}. ${q.q}`,q.m?el("span",{class:"hint"}," (несколько ответов)"):null));
    order[qi].forEach(ai=>{const id=`${key}-${qi}-${ai}`;
      wrap.append(el("label",{class:"opt",for:id},el("input",{type:q.m?"checkbox":"radio",name:`${key}-${qi}`,id,value:ai}),el("span",{},q.a[ai])))});
    form.append(wrap);
  });
  const res=el("div",{});
  form.append(el("div",{class:"row",style:"justify-content:flex-start;padding-top:8px"},el("button",{class:"btn primary",type:"submit"},"Проверить")));
  form.addEventListener("submit",e=>{e.preventDefault();
    let ok=0;
    qs.forEach((q,qi)=>{
      const chosen=[...form.querySelectorAll(`[name="${key}-${qi}"]:checked`)].map(x=>+x.value);
      const corr=q.m?q.c:[q.c];
      const right=chosen.length===corr.length&&corr.every(c=>chosen.includes(c));
      if(right) ok++;
      form.querySelectorAll(`[name="${key}-${qi}"]`).forEach(inp=>{const v=+inp.value;const lab=inp.closest(".opt");lab.classList.remove("ok","no");
        if(corr.includes(v)) lab.classList.add("ok"); else if(inp.checked) lab.classList.add("no"); inp.disabled=true;});
    });
    form.querySelector("button[type=submit]").disabled=true;
    const score=ok/qs.length, pass=score>=0.8;
    onDone(score);
    res.replaceChildren(el("div",{class:"verdict "+(pass?"pass":"fail")},`${ok} из ${qs.length} (${Math.round(score*100)}%). `+(pass?"Зачёт.":"Нужно 80%. Перечитай урок и попробуй завтра.")),
      el("div",{class:"row",style:"justify-content:flex-start;padding-top:10px"},
        el("button",{class:"btn",onclick:()=>{box.replaceWith(quizBlock(qs,key,onDone,onNext))}},"Пройти заново"),
        pass&&onNext?el("button",{class:"btn primary",onclick:onNext},"Следующий урок"):null));
  });
  box.append(form,res);return box;
}
function renderFinal(){
  const f=document.getElementById("final");f.replaceChildren();
  const n=LESSONS.filter(l=>passed(l.id)).length;
  f.append(el("div",{},el("div",{class:"eyebrow"},"Итоговая аттестация"),el("h2",{},"20 вопросов из всех уроков + 3 кейса «подбери товар клиенту»")));
  f.append(el("p",{class:"lesson"},"Зачёт — 80%. После теста — ролевой звонок с РОПом по чек-листу: структура, вопросы, парный товар, возражение, договорённость."));
  if(S.final) f.append(el("div",{class:"verdict "+(S.final.passed?"pass":"fail")},`Последняя попытка: ${Math.round(S.final.score*100)}%`+(S.final.passed?" — сдано":" — не сдано")));
  if(n<LESSONS.length){f.append(el("div",{class:"tip"},el("strong",{},"Пока закрыто. "),`Сначала пройди все уроки: ${n} из ${LESSONS.length}.`));return}
  const pool=LESSONS.flatMap(l=>l.quiz); const pick=shuffleIdx(pool.length).slice(0,20).map(i=>pool[i]);
  const qs=[...pick,...CASES];
  f.append(el("div",{class:"case"},"Последние 3 вопроса — кейсы: отметь все подходящие позиции."));
  f.append(quizBlock(qs,"final",score=>{S.final={score,passed:score>=0.8,at:new Date().toISOString()};persist();renderProgress()},null));
}
let teamUnsub=null, teamDocs=[];
async function renderTeam(){
  const t=document.getElementById("team");t.replaceChildren(
    el("div",{},el("div",{class:"eyebrow"},"Для РОПа и наставников"),el("h2",{},"Кто где в обучении")));
  if(!DB){t.append(el("p",{class:"note"},"Сводка недоступна в этом окне."));return}
  if(!teamDocs.length){t.append(el("p",{class:"note"},"Пока никто не сдал ни одного теста. Как только менеджер пройдёт первый урок, он появится здесь."));return}
  const ids=teamDocs.map(d=>d.id); const ps=USER?await USER.profiles(ids):{};
  const tb=el("tbody");
  teamDocs.forEach(d=>{const v=d.data()||{}; const ls=v.lessons||{};
    const done=LESSONS.filter(l=>ls[l.id]&&ls[l.id].best>=0.8).length;
    const scores=Object.values(ls).map(x=>x.best); const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100):0;
    const fin=v.final;
    const next=LESSONS.find(l=>!(ls[l.id]&&ls[l.id].best>=0.8));
    const name=el("td",{});name.textContent=(ps[d.id]&&ps[d.id].name)||"Менеджер";
    tb.append(el("tr",{},name,el("td",{class:"num"},`${done} / ${LESSONS.length}`),el("td",{class:"num"},avg+"%"),
      el("td",{},next?`${next.id} ${next.title}`:"—"),
      el("td",{},fin?el("span",{class:"pill "+(fin.passed?"ok":"wait")},`${Math.round(fin.score*100)}%`+(fin.passed?" сдано":" не сдано")):el("span",{class:"pill wait"},"не сдавал")),
      el("td",{class:"num"},v.updatedAt?new Date(v.updatedAt).toLocaleDateString("ru-RU"):"")));
  });
  t.append(el("div",{class:"tablewrap"},el("table",{},el("thead",{},el("tr",{},["Менеджер","Уроков сдано","Средний балл","Сейчас на уроке","Аттестация","Обновлено"].map(h=>el("th",{},h)))),tb)));
}
function setView(v){S.view=v;
  for(const k of ["course","final","team"]){document.getElementById("view-"+k).hidden=k!==v;document.getElementById("nav-"+k).setAttribute("aria-pressed",k===v?"true":"false")}
  render();}
function render(){renderProgress();if(S.view==="course"){renderMap();renderStage()}else if(S.view==="final")renderFinal();else renderTeam()}
document.getElementById("nav-course").onclick=()=>setView("course");
document.getElementById("nav-final").onclick=()=>setView("final");
document.getElementById("nav-team").onclick=()=>setView("team");

/* ---------- отчёт для руководителя (когда нет общей базы) ---------- */
function resultText(){
  let name=""; try{name=document.getElementById("my-name").value.trim()}catch(e){}
  const lines=[`Тренажёр AMINA — ${name||"менеджер"}, ${new Date().toLocaleDateString("ru-RU")}`];
  const n=LESSONS.filter(l=>passed(l.id)).length;
  lines.push(`Сдано уроков: ${n} из ${LESSONS.length}`);
  for(const l of LESSONS){const r=S.results[l.id]; if(r) lines.push(`${l.id} ${l.title}: ${Math.round(r.best*100)}% (попыток ${r.tries})`)}
  lines.push(S.final?`Аттестация: ${Math.round(S.final.score*100)}% — ${S.final.passed?"сдано":"не сдано"}`:"Аттестация: не сдавал");
  return lines.join("\n");
}
function showShare(){document.getElementById("share").hidden=false}
try{document.getElementById("my-name").value=localStorage.getItem("amina-trener-name")||""}catch(e){}
document.getElementById("my-name").addEventListener("change",e=>{try{localStorage.setItem("amina-trener-name",e.target.value.trim())}catch(err){}});
document.getElementById("copy-res").addEventListener("click",()=>{
  const txt=resultText(), note=document.getElementById("copy-note"), fb=document.getElementById("copy-fallback");
  const fallback=()=>{fb.value=txt;fb.hidden=false;fb.focus();fb.select();note.textContent="Скопируй текст ниже (Ctrl+C) и отправь руководителю"};
  try{navigator.clipboard.writeText(txt).then(()=>{note.textContent="Скопировано. Вставь в Telegram руководителю";fb.hidden=true},fallback)}catch(e){fallback()}
});

loadLocal();
const firstOpen=LESSONS.findIndex((l,i)=>unlocked(i)&&!passed(l.id)); if(firstOpen>=0) S.cur=LESSONS[firstOpen].id;
render();

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    USER=user; if(!db||!user) return;
    UID=await user.id(); if(!UID) return;
    DB=db;
    const snap=await db.doc("results/"+UID).get();
    if(snap.exists){const v=snap.data();
      for(const[k,r]of Object.entries(v.lessons||{})){const loc=S.results[k]; if(!loc||r.best>loc.best) S.results[k]=r}
      if(v.final&&(!S.final||v.final.score>S.final.score)) S.final=v.final;
      saveLocal(); render();}
    setSave("Результаты сохраняются — их видит руководитель");
    if(Object.keys(S.results).length) saveRemote();
    if(await user.canEdit()){
      document.getElementById("nav-team").hidden=false;
      teamUnsub=db.collection("results").onSnapshot(q=>{teamDocs=q.docs.filter(d=>d.exists);if(S.view==="team")renderTeam()},()=>{});
    }
  }catch(e){}
  finally{ if(!DB) showShare(); }
})();
</script>
