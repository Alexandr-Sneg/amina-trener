<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Тренажёр менеджера AMINA</title>
<style>
:root{--bg:#F3F6F2;--surface:#fff;--fg:#18231C;--muted:#5B6B60;--line:#D6DFD7;--leaf:#2F7A4C;--bad:#B3402F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111813;--surface:#18221B;--fg:#E4ECE6;--muted:#9AAEA0;--line:#2C3A30;--leaf:#5FBF85;--bad:#E77C6A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--leaf);background:var(--leaf);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <h1>Тренажёр менеджера AMINA</h1>
  <p>Введи пароль отдела. Его выдаёт руководитель.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
  <label class="rem"><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Войти</button>
  <div id="err" role="alert"></div>
</form>

  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function tryOpen(pw,remember){
  const html=await open(pw);
  if(remember){try{localStorage.setItem("amina-trener-pw",pw)}catch(e){}}
  show(html);
}
(async()=>{let saved=null;try{saved=localStorage.getItem("amina-trener-pw")}catch(e){}
  if(saved){try{await tryOpen(saved,false);return}catch(e){try{localStorage.removeItem("amina-trener-pw")}catch(x){}}}})();

  const b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;er.textContent="Проверяю…";
